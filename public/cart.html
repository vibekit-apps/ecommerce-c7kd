<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cart · Store</title>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="nav">
  <a class="brand" href="/" aria-label="Store home">
    <svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5.5 8h13l-1 11.5a1 1 0 0 1-1 .9H7.5a1 1 0 0 1-1-.9L5.5 8Z" />
      <path d="M9 8V6.5a3 3 0 0 1 6 0V8" />
    </svg>
    <span>Store</span>
  </a>
  <a class="cart-btn active" href="/cart.html" aria-label="View cart">
    <svg class="cart-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="9" cy="20" r="1.3" />
      <circle cx="18" cy="20" r="1.3" />
      <path d="M2.5 3.5h2l2.15 11a1.5 1.5 0 0 0 1.47 1.2h8.4a1.5 1.5 0 0 0 1.47-1.17L21 7.5H6" />
    </svg>
    <span class="cart-label">Cart</span>
    <span id="cart-count" class="cart-count">0</span>
  </a>
</header>

<main class="cart-page">
  <h1>Your cart</h1>
  <div id="cart-body" class="cart-body">
    <div class="muted">Loading…</div>
  </div>
</main>

<script src="/app.js"></script>
<script>store.bindCartPage();</script>
</body>
</html>
