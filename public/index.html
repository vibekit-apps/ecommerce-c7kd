<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Store</title>
    <meta name="description" content="An online store. Browse products, add to cart, and check out.">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="data:image/svg+xml,<svg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22><rect%20x=%2212%22%20y=%2212%22%20width=%2276%22%20height=%2276%22%20rx=%2218%22%20fill=%22%23111827%22/></svg>">
    <!-- Social share preview (Open Graph + Twitter). When you brand this app, update the
         title/description here and swap og:image & twitter:image for your own 1200x630 image. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Store">
    <meta property="og:description" content="An online store. Browse products, add to cart, and check out.">
    <meta property="og:image" content="https://vibekit.bot/public/og-vibekit.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Store">
    <meta name="twitter:description" content="An online store. Browse products, add to cart, and check out.">
    <meta name="twitter:image" content="https://vibekit.bot/public/og-vibekit.png">
<link rel="preconnect" href="https://images.unsplash.com" crossorigin />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="nav">
  <a class="brand" href="/" aria-label="Store home">
    <svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5.5 8h13l-1 11.5a1 1 0 0 1-1 .9H7.5a1 1 0 0 1-1-.9L5.5 8Z" />
      <path d="M9 8V6.5a3 3 0 0 1 6 0V8" />
    </svg>
    <span>Store</span>
  </a>
  <nav class="categories" aria-label="Product categories">
    <button class="cat active" data-cat="">All</button>
    <button class="cat" data-cat="electronics">Electronics</button>
    <button class="cat" data-cat="apparel">Apparel</button>
    <button class="cat" data-cat="home">Home</button>
    <button class="cat" data-cat="accessories">Accessories</button>
  </nav>
  <a class="cart-btn" href="/cart.html" aria-label="View cart">
    <svg class="cart-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="9" cy="20" r="1.3" />
      <circle cx="18" cy="20" r="1.3" />
      <path d="M2.5 3.5h2l2.15 11a1.5 1.5 0 0 0 1.47 1.2h8.4a1.5 1.5 0 0 0 1.47-1.17L21 7.5H6" />
    </svg>
    <span class="cart-label">Cart</span>
    <span id="cart-count" class="cart-count">0</span>
  </a>
</header>

<div id="order-banner" class="order-banner" hidden></div>

<section class="hero">
  <h1>Built well. Priced honestly.</h1>
  <p>Our small catalog of things we'd actually buy.</p>
</section>

<main>
  <div id="product-grid" class="product-grid"></div>
</main>

<footer>
  <span>Store starter. Your scaffold to fork.</span>
</footer>

<script src="/app.js"></script>
<script>store.bindHome();</script>
</body>
</html>
